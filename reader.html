<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Читалка Книги Памяти | Музей СРМК</title>
  <meta name="description" content="Интерактивная читалка 21 тома Книги Памяти ГБПОУ СРМК с поддержкой книжного разворота, аудиогида и озвучки.">
  <meta name="theme-color" content="#11100e">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/pages/book-reader.css">
</head>
<body data-section="reader">

  <header class="srmk-header" id="siteHeader"></header>

  <div class="reader-toolbar">
    <div class="container reader-toolbar-inner">
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <a href="memory-book.html" class="btn btn-ghost" style="min-height:36px; padding:4px 10px;">← К каталогу</a>
        <button type="button" class="btn btn-secondary" id="btnReaderAudio" style="min-height:36px; padding:4px 12px;">🎧 Аудиогид</button>
        <button type="button" class="btn btn-ghost" id="btnReaderTTS" style="min-height:36px; padding:4px 12px;">🔊 Озвучить текст</button>
      </div>
      <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
        <button type="button" class="btn btn-ghost" id="btnViewFlow" style="min-height:36px; padding:4px 10px;">Статья</button>
        <button type="button" class="btn btn-ghost" id="btnViewSpread" style="min-height:36px; padding:4px 10px;">Разворот</button>
        <button type="button" class="btn btn-ghost" id="btnReaderTheme" style="min-height:36px; padding:4px 10px;">Тёмный / Бумага</button>
        <button type="button" class="btn btn-ghost" id="btnFontMinus" style="min-height:36px; padding:4px 10px;">A-</button>
        <button type="button" class="btn btn-ghost" id="btnFontPlus" style="min-height:36px; padding:4px 10px;">A+</button>
      </div>
    </div>
    <div class="reader-progress-track"><div class="reader-progress-bar" id="readerProgressBar"></div></div>
  </div>

  <main class="container reader-layout">
    <aside class="reader-toc" aria-label="Оглавление Книги Памяти">
      <div style="font-family:var(--font-display); color:var(--accent-primary); font-size:0.9rem; margin-bottom:10px;">Оглавление (21 том)</div>
      <div id="readerTocList"></div>
    </aside>

    <article class="reader-paper" id="readerPaper" data-view="flow">
      <div class="reader-chapter-head" id="readerChapterHead"></div>
      <div class="reader-article" id="readerArticleBody"></div>
      <div class="reader-nav-footer">
        <button type="button" class="btn btn-secondary" id="btnPrevChapter">← Предыдущая глава</button>
        <button type="button" class="btn btn-primary" id="btnNextChapter">Следующая глава →</button>
      </div>
    </article>
  </main>

  <footer class="srmk-footer" id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/data.js"></script>
  <script src="js/grand-memory-book-part-1.js"></script>
  <script src="js/grand-memory-book-part-2.js"></script>
  <script src="js/grand-memory-book-part-3.js"></script>
  <script src="js/achievements-engine.js"></script>
  <script src="js/tts-narrator.js"></script>
  <script src="js/audio-dock.js"></script>
  <script src="js/lesson-cinema.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/spotlight.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
