<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Электронная Книга Памяти | «Быть воином — жить вечно» ГБПОУ СРМК</title>
  <meta name="description" content="Электронная летопись памяти 20 выпускников ГБПОУ СРМК: пролог открытия мемориала и 20 биографических глав.">
  <meta name="theme-color" content="#11100e">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/pages/book-reader.css">
</head>
<body data-section="memory-book">

  <header class="srmk-header" id="siteHeader"></header>

  <main>
    <section class="book-hero">
      <div class="container book-hero-grid">
        <div>
          <div class="hero-kicker">Летопись • 21 том (Пролог + 20 глав)</div>
          <h1>Электронная <span>Книга Памяти</span></h1>
          <p style="color:var(--text-secondary); max-width:58ch; margin-bottom:18px;">
            Полное собрание исторических очерков о студенческих годах, воинском пути и подвигах 20 выпускников ГБПОУ СРМК.
          </p>
          <div style="display:flex; flex-wrap:wrap; gap:10px;">
            <a href="reader.html#prologue-memorial-opening" class="btn btn-primary">📖 Читать с Пролога</a>
            <button type="button" class="btn btn-secondary" id="btnPlayPrologueAudio">🎧 Слушать обзорную экскурсию</button>
          </div>
        </div>
        <div>
          <img src="assets/images/cover-master.jpg" alt="Обложка Книги Памяти СРМК" class="book-hero-poster">
        </div>
      </div>
    </section>

    <section class="container">
      <div class="book-controls">
        <input type="search" class="desks-search" id="bookSearchInput" placeholder="Поиск тома по фамилии, награде или рубежу..." aria-label="Поиск по Книге Памяти" style="flex:1 1 260px; max-width:380px; min-height:44px; padding:8px 14px; border-radius:6px; border:1px solid var(--border-subtle); background:var(--bg-surface); color:var(--text-primary);">
        <div class="filter-pills" id="bookPlaqueFilters" style="display:flex; flex-wrap:wrap; gap:8px;">
          <button type="button" class="filter-pill active" data-book-filter="all">Все тома (21)</button>
          <button type="button" class="filter-pill" data-book-filter="general">Пролог</button>
          <button type="button" class="filter-pill" data-book-filter="left">Левая плита</button>
          <button type="button" class="filter-pill" data-book-filter="right">Правая плита</button>
        </div>
      </div>

      <div class="volumes-grid" id="volumesGrid"></div>
    </section>
  </main>

  <footer class="srmk-footer" id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/data.js"></script>
  <script src="js/grand-memory-book-part-1.js"></script>
  <script src="js/grand-memory-book-part-2.js"></script>
  <script src="js/grand-memory-book-part-3.js"></script>
  <script src="js/achievements-engine.js"></script>
  <script src="js/tts-narrator.js"></script>
  <script src="js/audio-dock.js"></script>
  <script src="js/lesson-cinema.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/spotlight.js"></script>
  <script src="js/memory-book.js"></script>
</body>
</html>
